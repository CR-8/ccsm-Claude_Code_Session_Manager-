name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        # No network, no Claude Code install, and CCSM_RUNTIME is pinned to a temp
        # tree inside the suite so nothing can reach a real ~/.claude.
        run: python tests/test_ccsm.py
      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes ccsm tests
